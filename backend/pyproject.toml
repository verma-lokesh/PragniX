[project]
name = "navora-backend"
version = "0.1.0"
description = "Navora maritime freight decision-support backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "alembic>=1.13",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "joblib>=1.4",
  "langchain>=0.2",
  "langgraph>=0.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
